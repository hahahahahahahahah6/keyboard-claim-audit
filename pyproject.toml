[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keyboard-claim-audit"
version = "0.1.0"
description = "Static audit of documented synthetic key input"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
keyboard-claim-audit = "keyboard_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["keyboard_claim_audit*"]
